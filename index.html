O XFlason t é reconhecido como o maior cantor de música temática nerd do mundo, sendo pioneiro do gênero no Brasil. Com uma trajetória de sucesso. Fundado em 2018, o XFlason t é composto por Thállys C. O próprio se destaca por mesclar influências de rap, rock e pop, ditar tendências na música nerd nacional, e contar com uma comunidade de fãs extremamente dedicada, conhecida como os iLuminados.
